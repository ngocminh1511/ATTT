# Lab mục 5.3: 1 FL server + 3 chi nhánh (victim + sensor) + 1 attacker.
# Chạy từ thư mục gốc dự án:
#   docker compose -f lab/docker-compose.yml up -d --build
#   flwr run . lab --stream                       # huấn luyện FL qua mạng mgmt
#   docker compose -f lab/docker-compose.yml exec attacker /lab/traffic.sh site1-victim
#
# Mạng mgmt chỉ chở trọng số mô hình; mạng siteN chở traffic thật -> gói tin không rời chi nhánh.
# Sensor dùng chung network namespace với victim (network_mode: service:...) để Suricata thấy
# toàn bộ traffic tới victim (trên bridge Docker, container khác không nghe lén được).
# CHỈ tấn công trong các mạng Docker cô lập này (internal: true -> không ra Internet).

x-sensor: &sensor
  build: { context: .., dockerfile: lab/sensor/Dockerfile }
  cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
  depends_on: [fl-server]
  restart: unless-stopped
  deploy: { resources: { limits: { cpus: "1.5", memory: 1g } } }

services:
  fl-server:
    build: { context: .., dockerfile: lab/fl/Dockerfile }
    command: ["flower-superlink", "--insecure"]
    ports: ["9093:9093"]                 # Control API cho `flwr run . lab` từ máy host
    volumes:
      - ../data/test_day2.parquet:/app/data/test_day2.parquet:ro
      - ../data/features.json:/app/data/features.json:ro
      - ../data/scaler.json:/app/data/scaler.json:ro
      - ../results:/app/results
    networks: [mgmt, egress]

  site1-victim: &victim
    image: nginx:alpine
    networks: { site1: { ipv4_address: 172.31.1.10 }, mgmt: {} }
  site2-victim:
    <<: *victim
    networks: { site2: { ipv4_address: 172.31.2.10 }, mgmt: {} }
  site3-victim:
    <<: *victim
    networks: { site3: { ipv4_address: 172.31.3.10 }, mgmt: {} }

  site1-sensor:
    <<: *sensor
    network_mode: "service:site1-victim"
    environment: { PARTITION_ID: "0", NUM_PARTITIONS: "3", SITE_SUBNET: "172.31.1.", SUPERLINK: "fl-server:9092" }
    volumes:
      - ../data/lab/client_1.parquet:/data/local.parquet:ro
      - ../data/features.json:/app/data/features.json:ro
      - ../data/scaler.json:/app/data/scaler.json:ro
      - ../results:/app/results:ro           # detector chờ results/global.pt (bước 6: triển khai)
      - ./logs/site1:/var/log/suricata
  site2-sensor:
    <<: *sensor
    network_mode: "service:site2-victim"
    environment: { PARTITION_ID: "1", NUM_PARTITIONS: "3", SITE_SUBNET: "172.31.2.", SUPERLINK: "fl-server:9092" }
    volumes:
      - ../data/lab/client_2.parquet:/data/local.parquet:ro
      - ../data/features.json:/app/data/features.json:ro
      - ../data/scaler.json:/app/data/scaler.json:ro
      - ../results:/app/results:ro           # detector chờ results/global.pt (bước 6: triển khai)
      - ./logs/site2:/var/log/suricata
  site3-sensor:
    <<: *sensor
    network_mode: "service:site3-victim"
    environment: { PARTITION_ID: "2", NUM_PARTITIONS: "3", SITE_SUBNET: "172.31.3.", SUPERLINK: "fl-server:9092" }
    volumes:
      - ../data/lab/client_3.parquet:/data/local.parquet:ro
      - ../data/features.json:/app/data/features.json:ro
      - ../data/scaler.json:/app/data/scaler.json:ro
      - ../results:/app/results:ro           # detector chờ results/global.pt (bước 6: triển khai)
      - ./logs/site3:/var/log/suricata

  attacker:
    build: { context: ., dockerfile: attacker/Dockerfile }
    command: ["sleep", "infinity"]
    cap_add: [NET_ADMIN, NET_RAW]
    deploy: { resources: { limits: { cpus: "1.0" } } }   # tránh treo laptop khi flood
    volumes:
      - ./attacker/traffic.sh:/lab/traffic.sh:ro
      - ./pcaps:/pcaps:ro
      - ./logs:/logs
    networks:
      site1: { ipv4_address: 172.31.1.100 }
      site2: { ipv4_address: 172.31.2.100 }
      site3: { ipv4_address: 172.31.3.100 }

networks:
  mgmt: { internal: true }
  egress: {}                              # chỉ fl-server, để host gọi được cổng 9093
  site1: { internal: true, ipam: { config: [{ subnet: 172.31.1.0/24 }] } }
  site2: { internal: true, ipam: { config: [{ subnet: 172.31.2.0/24 }] } }
  site3: { internal: true, ipam: { config: [{ subnet: 172.31.3.0/24 }] } }
