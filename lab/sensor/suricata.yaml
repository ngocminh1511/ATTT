%YAML 1.1
---
# Cấu hình Suricata tối giản cho sensor (mục 5.2).
# Kiểm tra: suricata -T -c /etc/suricata/suricata.yaml

vars:
  address-groups:
    HOME_NET: "[172.31.0.0/16,192.168.0.0/16,10.0.0.0/8]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"

default-log-dir: /var/log/suricata/
default-rule-path: /etc/suricata/rules
rule-files:
  - local.rules        # lớp 1: luật threshold (mục 7.1)
  - ml.rules           # luật drop do detector sinh ra (chế độ IPS, mục 7.3)

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      community-id: true
      types:
        - alert
        - flow          # nguồn đặc trưng cho mô hình
        - stats:
            totals: yes

stats:
  enabled: yes
  interval: 10

# Flow chỉ được ghi khi kết thúc/hết hạn -> rút ngắn timeout để gần thời gian thực
flow-timeouts:
  default: { new: 10, established: 30, closed: 0, emergency-new: 5, emergency-established: 10 }
  tcp:     { new: 10, established: 30, closed: 5, emergency-new: 5, emergency-established: 10, emergency-closed: 0 }
  udp:     { new: 10, established: 15, emergency-new: 5, emergency-established: 10 }
  icmp:    { new: 10, established: 15, emergency-new: 5, emergency-established: 10 }

flow:
  memcap: 128mb
  hash-size: 65536
  prealloc: 10000

af-packet:
  - interface: default
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes

unix-command:
  enabled: yes          # cho `suricatasc -c reload-rules`

logging:
  default-log-level: notice
  outputs:
    - console: { enabled: yes }
    - file: { enabled: yes, filename: /var/log/suricata/suricata.log }
