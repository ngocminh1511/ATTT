[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-ddos"
version = "1.0.0"
description = "Federated Learning phát hiện DDoS (theo Alshdadi et al., Future Internet 2025)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
# Cố định phiên bản Flower: API ClientApp/ServerApp/Message thay đổi giữa các bản (mục 9.3).
# torch cài riêng (bản CUDA hoặc CPU), xem README.
dependencies = [
    "flwr[simulation]==1.40.0",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["ipykernel", "nbformat", "nbclient"]
cloud = ["modal>=1.6,<2"]

[tool.hatch.build.targets.wheel]
packages = ["fl_ddos"]

[tool.flwr.app]
publisher = "student"

[tool.flwr.app.components]
serverapp = "fl_ddos.server_app:app"
clientapp = "fl_ddos.client_app:app"

[tool.flwr.app.config]
# Mặc định = thiết lập của paper (mục 5.1): 30 vòng, 5 epoch cục bộ, lr 0.001, dropout 0.3, batch 64, FedAvg.
# Pipeline cũ (data/, MLP nhị phân): arch='mlp' local-epochs=2 batch-size=256 scenario='S3' (xem scripts/run_all.*).
num-server-rounds = 30
local-epochs = 5
lr = 0.001
batch-size = 64
dropout = 0.3
arch = "resvgg_swin"     # resvgg_swin | resnet | resnet_vgg | resnet_swin (ablation) | mlp | lstm | lstm_gru
proximal-mu = 0.0        # 0 = FedAvg; 0.01 hoặc 0.1 = FedProx
scenario = "paper"       # paper (data_paper/) | S1, S2a, S2b, S3, S4 (data/)
seed = 0
strategy = "fedavg"      # fedavg | trimmed (FedTrimmedAvg, cho E7)
poison-clients = ""      # E7: partition-id bị đầu độc, vd "0" hoặc "0,3"
num-clients = 3          # để tính MB truyền thông
tag-suffix = ""          # thêm vào tên file kết quả, vd "_leak" khi so sánh các biến thể tiền xử lý
data-dir = ""            # Flower chạy bản sao app trong ~/.flwr/apps -> scripts/fl_run.* truyền đường dẫn tuyệt đối
results-dir = ""
